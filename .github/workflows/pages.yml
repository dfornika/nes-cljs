# Build the site with shadow-cljs and publish it to GitHub Pages.
#
# Runs on every push to main (and can be started by hand from the Actions
# tab). The `test` step runs the unit tests first, so a failing test stops
# a broken site from being published.
#
# One-time setup: in the repository's Settings -> Pages, set "Source" to
# "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; a newer push cancels an older, still-queued one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install the Clojure CLI
        run: |
          curl -fsSL -O https://github.com/clojure/brew-install/releases/latest/download/linux-install.sh
          chmod +x linux-install.sh
          sudo ./linux-install.sh

      # Clojure dependencies (Maven jars and git deps), so later runs don't
      # download them all again.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
          key: clj-${{ runner.os }}-${{ hashFiles('deps.edn') }}
          restore-keys: clj-${{ runner.os }}-

      - run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build the site
        run: npm run release

      - uses: actions/upload-pages-artifact@v3
        with:
          path: resources/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
